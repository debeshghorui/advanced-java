<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Library Management System - Register Book</title>
<style>
	body {
		font-family: Arial, sans-serif;
		background-color: #f4f4f4;
		margin: 0;
	}
	h1 {
		text-align: center;
		color: #333;
		background-color: #2c3e50;
		color: white;
		padding: 15px;
		margin: 0;
	}
	.container {
		width: 500px;
		margin: 40px auto;
		background-color: white;
		padding: 25px;
		border-radius: 8px;
		box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
	}
	label {
		display: block;
		margin: 10px 0 5px;
		font-weight: bold;
	}
	input[type="text"], input[type="number"] {
		width: 95%;
		padding: 8px;
		border: 1px solid #ccc;
		border-radius: 4px;
	}
	input[type="submit"] {
		margin-top: 15px;
		padding: 10px 25px;
		background-color: #2c3e50;
		color: white;
		border: none;
		border-radius: 4px;
		cursor: pointer;
	}
	input[type="submit"]:hover {
		background-color: #1a252f;
	}
	.link {
		display: block;
		text-align: center;
		margin-top: 15px;
	}
</style>
</head>
<body>
	<h1>Library Management System</h1>
	<div class="container">
		<h2>Register New Book</h2>
		<form action="register" method="get">
			<label for="bookid">Book Id:</label>
			<input type="number" id="bookid" name="bookid" required><br>

			<label for="title">Book Title:</label>
			<input type="text" id="title" name="title" required><br>

			<label for="author">Author Name:</label>
			<input type="text" id="author" name="author"><br>

			<label for="publisher">Publisher Name:</label>
			<input type="text" id="publisher" name="publisher"><br>

			<label for="category">Category:</label>
			<input type="text" id="category" name="category"><br>

			<label for="edition">Edition:</label>
			<input type="text" id="edition" name="edition"><br>

			<label for="year">Publication Year:</label>
			<input type="number" id="year" name="year"><br>

			<label for="price">Price:</label>
			<input type="number" step="0.01" id="price" name="price"><br>

			<label for="quantity">Available Quantity:</label>
			<input type="number" id="quantity" name="quantity"><br>

			<input type="submit" value="Register Book">
		</form>
		<a class="link" href="display">View All Books</a>
	</div>
</body>
</html>
